<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xat en temps real - Socket.IO</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <main class="app">
        <section id="loginFormSection" class="login-card">
            <h1>Entrada al xat</h1>
            <div class="login-field">
                <label for="username">Àlies / Nom (màx. 20 caràcters):</label>
                <input id="username" type="text" maxlength="20" placeholder="Ex: Kim" required autofocus />
            </div>

            <div class="room-actions">
                <div class="room-box">
                    <h3>Crear una sala nova</h3>
                    <button id="createRoomBtn" type="button" class="login-btn">Crear sala</button>
                </div>
                <div class="room-box">
                    <h3>Unir-se a una sala</h3>
                    <div style="display: flex; gap: 8px;">
                        <input id="roomCodeInput" type="text" maxlength="10" placeholder="Codi (ex: ABC12)" style="width: 140px; padding: 8px 10px; font-size: 0.95rem; border: 1px solid #9ca3af; border-radius: 6px;" />
                        <button id="joinRoomBtn" type="button" class="login-btn">Entrar</button>
                    </div>
                </div>
            </div>

            <div id="loginError" class="error" aria-live="polite"></div>
        </section>

        <section id="chatSection" class="chat-card hidden">
            <div class="chat-window">
                <header class="chat-header">
                    <div class="chat-title">Xat Socket.IO</div>
                    <div>Sala: <strong id="currentRoom"></strong> <button id="copyBtn" type="button" class="login-btn" style="padding: 3px 8px; font-size: 0.8rem; margin-left: 4px;">Copiar codi</button></div>
                    <div class="chat-user">Usuari: <strong id="currentUser"></strong></div>
                    <div id="connectionStatus" class="connection-status">
                        <span id="connectionDot" class="dot"></span> <span id="connectionText">Connectat</span>
                    </div>
                    <button id="leaveBtn" type="button" class="login-btn" style="padding: 4px 10px; font-size: 0.85rem;">Sortir</button>
                </header>

                <div class="chat-body">
                    <div class="chat-main">
                        <div id="messages" class="messages" aria-live="polite">
                            <div class="system-welcome">
                                <p>Benvingut/da a la sala. Els missatges apareixeran a continuació.</p>
                            </div>
                        </div>

                        <div id="chatErrorMessage" class="error" style="padding: 0 16px; margin: 0;" aria-live="polite"></div>

                        <form class="composer" id="messageForm" autocomplete="off">
                            <input id="messageInput" type="text" maxlength="500" placeholder="Escriu un missatge..." autocomplete="off" disabled />
                            <div class="composer-actions">
                                <button id="simulateDropBtn" type="button" class="secondary-btn" title="Simula un tall temporal de xarxa per provar la recuperació">Simular tall transport</button>
                                <button id="sendBtn" type="submit" disabled>Enviar</button>
                            </div>
                        </form>
                    </div>

                    <aside class="chat-sidebar">
                        <h3>Participants (<span id="participantCount">0</span>)</h3>
                        <ul id="participantsList"></ul>
                    </aside>
                </div>

                <div id="recoveryStatus" class="recovery-status" aria-live="polite">
                    Estat: Inicialitzant...
                </div>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            reconnectionDelay: 10000,
            reconnectionDelayMax: 10000,
            randomizationFactor: 0
        });

        let myRoom = '';
        let myUsername = '';

        const loginFormSection = document.getElementById('loginFormSection');
        const usernameInput = document.getElementById('username');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const joinRoomBtn = document.getElementById('joinRoomBtn');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const loginError = document.getElementById('loginError');

        const chatSection = document.getElementById('chatSection');
        const currentRoom = document.getElementById('currentRoom');
        const copyBtn = document.getElementById('copyBtn');
        const currentUser = document.getElementById('currentUser');
        const leaveBtn = document.getElementById('leaveBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionDot = document.getElementById('connectionDot');
        const connectionText = document.getElementById('connectionText');
        const recoveryStatus = document.getElementById('recoveryStatus');

        const messagesContainer = document.getElementById('messages');
        const chatErrorMessage = document.getElementById('chatErrorMessage');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const simulateDropBtn = document.getElementById('simulateDropBtn');
        const participantCount = document.getElementById('participantCount');
        const participantsList = document.getElementById('participantsList');

        function addMessage({ author, text, time, isSelf, isSystem }) {
            const messageEl = document.createElement('div');
            if (isSystem) {
                messageEl.className = 'message system';
                messageEl.textContent = `[${time}] ${text}`;
                messagesContainer.appendChild(messageEl);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                return;
            }

            messageEl.className = `message ${isSelf ? 'self' : ''}`;
            const headerEl = document.createElement('div');
            headerEl.className = 'message-header';

            const authorEl = document.createElement('span');
            authorEl.className = 'message-author';
            authorEl.textContent = author;

            const timeEl = document.createElement('span');
            timeEl.className = 'message-time';
            timeEl.textContent = time;

            const textEl = document.createElement('p');
            textEl.className = 'message-text';
            textEl.textContent = text;

            headerEl.appendChild(authorEl);
            headerEl.appendChild(timeEl);
            messageEl.appendChild(headerEl);
            messageEl.appendChild(textEl);

            messagesContainer.appendChild(messageEl);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateConnectionState() {
            const connected = socket.connected;
            const hasRoom = Boolean(myRoom);

            if (connected) {
                connectionStatus.classList.remove('offline');
                connectionDot.classList.remove('offline');
                connectionText.textContent = 'En línia';
            } else {
                connectionStatus.classList.add('offline');
                connectionDot.classList.add('offline');
                connectionText.textContent = 'Desconnectat';
            }

            messageInput.disabled = !connected || !hasRoom;
            sendBtn.disabled = !connected || !hasRoom;
            simulateDropBtn.disabled = !connected || !hasRoom;
        }

        function updateRecoveryStatus(text, statusType) {
            recoveryStatus.textContent = text;
            recoveryStatus.className = `recovery-status status-${statusType}`;
        }

        createRoomBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            if (!username) return loginError.textContent = 'El nom no pot estar buit.';
            loginError.textContent = '';
            socket.emit('room:create', { username });
        });

        joinRoomBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const roomId = roomCodeInput.value.trim().toUpperCase();
            if (!username) return loginError.textContent = 'El nom no pot estar buit.';
            if (!roomId) return loginError.textContent = 'Introdueix un codi de sala.';
            loginError.textContent = '';
            socket.emit('room:join', { username, roomId });
        });

        leaveBtn.addEventListener('click', () => {
            socket.emit('room:leave');
        });

        copyBtn.addEventListener('click', () => {
            if (!myRoom) return;
            navigator.clipboard.writeText(myRoom);
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copiat!';
            setTimeout(() => { copyBtn.textContent = originalText; }, 1500);
        });

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            chatErrorMessage.textContent = '';
            socket.emit('chat:send', { text });
            messageInput.value = '';
            messageInput.focus();
        });

        simulateDropBtn.addEventListener('click', () => {
            if (socket.io && socket.io.engine) {
                socket.io.engine.close();
            }
        });

        socket.on('connect', () => {
            updateConnectionState();
            if (socket.recovered) {
                updateRecoveryStatus('Sessió recuperada amb èxit (socket.recovered: true)', 'success');
            } else {
                updateRecoveryStatus('Sessió nova o estat no recuperat (socket.recovered: false)', 'neutral');
            }
        });

        socket.on('disconnect', (reason) => {
            updateConnectionState();
            updateRecoveryStatus(`Tall detectat (${reason}). Intentant reconnexió automàtica (10s)...`, 'warning');
        });

        socket.on('room:joined', ({ roomId, username }) => {
            myRoom = roomId;
            myUsername = username;
            currentRoom.textContent = roomId;
            currentUser.textContent = username;

            messagesContainer.innerHTML = `
                <div class="system-welcome">
                    <p>Has entrat a la sala <strong>${roomId}</strong>. Els missatges només s'enviaran als participants d'aquesta sala.</p>
                </div>
            `;

            loginFormSection.classList.add('hidden');
            chatSection.classList.remove('hidden');
            updateConnectionState();
            messageInput.focus();
        });

        socket.on('room:left', () => {
            myRoom = '';
            chatSection.classList.add('hidden');
            loginFormSection.classList.remove('hidden');
            roomCodeInput.value = '';
            updateConnectionState();
            roomCodeInput.focus();
        });

        socket.on('room:error', (err) => {
            loginError.textContent = typeof err === 'string' ? err : (err?.message || 'Error de sala.');
        });

        socket.on('room:participants', (participants) => {
            const list = Array.isArray(participants) ? participants : (participants.participants || []);
            participantCount.textContent = list.length;
            participantsList.innerHTML = '';
            list.forEach((p) => {
                const name = typeof p === 'string' ? p : p.username;
                const li = document.createElement('li');
                li.textContent = name + (name === myUsername ? ' (Tu)' : '');
                if (name === myUsername) li.classList.add('self');
                participantsList.appendChild(li);
            });
        });

        socket.on('chat:message', (msg) => {
            chatErrorMessage.textContent = '';
            if (msg.type === 'system') {
                addMessage({ text: msg.text, time: msg.time, isSystem: true });
            } else {
                addMessage({
                    author: msg.username,
                    text: msg.text,
                    time: msg.time,
                    isSelf: msg.username === myUsername,
                    isSystem: false
                });
            }
        });

        socket.on('chat:error', (err) => {
            chatErrorMessage.textContent = typeof err === 'string' ? err : (err?.message || 'Error en enviar el missatge.');
        });

        updateConnectionState();
    </script>
</body>

</html>
