<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xat Socket.IO</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <main class="app">
        <section id="loginFormSection" class="login-card">
            <h1>Entrada al xat</h1>
            <div class="login-field">
                <label for="username">Nom</label>
                <input id="username" type="text" maxlength="20" placeholder="Escriu el teu nom" />
            </div>
            <button id="joinBtn" type="button" class="login-btn">Entrar</button>
            <div id="errorMessage" class="error" aria-live="polite"></div>
        </section>

        <section id="chatSection" class="chat-card hidden">
            <div class="chat-window">
                <header class="chat-header">
                    <div class="chat-title">Xat</div>
                    <div class="chat-user">Usuari: <strong id="currentUser"></strong></div>
                    <div id="connectionStatus" class="connection-status"><span id="connectionDot" class="dot"></span> En línia</div>
                </header>

                <div id="messages" class="messages" aria-live="polite">
                    <div class="message">
                        <div class="message-header">
                            <span class="message-author">Sistema</span>
                            <span class="message-time">12:00</span>
                        </div>
                        <p class="message-text">Aquí apareixeran els missatges del xat.</p>
                    </div>
                </div>

                <form class="composer" id="messageForm">
                    <input id="messageInput" type="text" placeholder="Escriu un missatge..." autocomplete="off" disabled />
                    <div class="composer-actions">
                        <button id="disconnectBtn" type="button" class="secondary-btn">Desconnectar</button>
                        <button id="sendBtn" type="submit" disabled>Enviar</button>
                    </div>
                </form>
                <div id="recoveryStatus" class="recovery-status" aria-live="polite">Estat de recuperació: pendent</div>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            reconnectionDelay: 10000,
            reconnectionDelayMax: 10000,
            randomizationFactor: 0
        });
        const usernameInput = document.getElementById('username');
        const joinBtn = document.getElementById('joinBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loginFormSection = document.getElementById('loginFormSection');
        const chatSection = document.getElementById('chatSection');
        const currentUser = document.getElementById('currentUser');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messages');
        const sendBtn = document.getElementById('sendBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionDot = document.getElementById('connectionDot');
        const recoveryStatus = document.getElementById('recoveryStatus');

        function updateConnectionState() {
            const connected = socket.connected;
            const hasUser = currentUser.textContent.trim().length > 0;

            connectionStatus.classList.toggle('offline', !connected);
            connectionDot.classList.toggle('offline', !connected);
            connectionStatus.innerHTML = `<span id="connectionDot" class="dot ${connected ? '' : 'offline'}"></span> ${connected ? 'En línia' : 'Desconnectat'}`;
            messageInput.disabled = !connected || !hasUser;
            sendBtn.disabled = !connected || !hasUser;
            disconnectBtn.disabled = !hasUser;
        }

        function updateRecoveryStatus() {
            const recovered = Boolean(socket.recovered);

            if (recovered) {
                recoveryStatus.textContent = `Recuperació: correcta (socket.recovered = ${recovered})`;
                recoveryStatus.classList.add('success');
                recoveryStatus.classList.remove('warning');
                return;
            }

            recoveryStatus.textContent = 'Recuperació: sessió nova o estat no recuperat (socket.recovered = false)';
            recoveryStatus.classList.add('warning');
            recoveryStatus.classList.remove('success');
        }

        function showError(message) {
            errorMessage.textContent = message;
        }

        function hideError() {
            errorMessage.textContent = '';
        }

        function validateName(name) {
            const trimmed = name.trim();
            return trimmed.length > 0 && trimmed.length <= 20;
        }

        function addMessage({ author, text, time, isSelf }) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${isSelf ? 'self' : ''}`;

            const header = document.createElement('div');
            header.className = 'message-header';

            const authorElement = document.createElement('span');
            authorElement.className = 'message-author';
            authorElement.textContent = author;

            const timeElement = document.createElement('span');
            timeElement.className = 'message-time';
            timeElement.textContent = time;

            header.appendChild(authorElement);
            header.appendChild(timeElement);

            const textElement = document.createElement('p');
            textElement.className = 'message-text';
            textElement.textContent = text;

            messageElement.appendChild(header);
            messageElement.appendChild(textElement);
            messagesContainer.appendChild(messageElement);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        joinBtn.addEventListener('click', () => {
            const name = usernameInput.value;

            if (!validateName(name)) {
                showError('El nom no pot estar buit ni contenir només espais i ha de tenir com a màxim 20 caràcters.');
                return;
            }

            hideError();
            socket.emit('join-chat', { name });
        });

        messageForm.addEventListener('submit', (event) => {
            event.preventDefault();

            if (!socket.connected) {
                return;
            }

            const text = messageInput.value.trim();
            if (!text) {
                return;
            }

            const username = currentUser.textContent.trim();
            socket.emit('chat:send', { username, text });
            messageInput.value = '';
        });

        disconnectBtn.addEventListener('click', () => {
            if (!socket.connected) {
                return;
            }

            socket.io.engine.close();
            updateConnectionState();
        });

        socket.on('connect', () => {
            updateConnectionState();
            updateRecoveryStatus();
        });

        socket.on('reconnect', () => {
            updateConnectionState();
            updateRecoveryStatus();
            addMessage({
                author: 'Sistema',
                text: `Reconnectat. socket.recovered = ${Boolean(socket.recovered)}`,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }),
                isSelf: false
            });
        });

        socket.on('disconnect', () => {
            updateConnectionState();
            recoveryStatus.textContent = `Desconnectat. socket.recovered = ${Boolean(socket.recovered)}`;
            recoveryStatus.classList.add('warning');
            recoveryStatus.classList.remove('success');
        });

        socket.on('join-success', ({ username }) => {
            currentUser.textContent = username;
            loginFormSection.classList.add('hidden');
            chatSection.classList.remove('hidden');
            updateConnectionState();
        });

        socket.on('join-error', ({ message }) => {
            showError(message || 'El nom no és vàlid.');
        });

        socket.on('chat:message', ({ username, text, time }) => {
            const isSelf = username === currentUser.textContent.trim();
            addMessage({
                author: username,
                text,
                time,
                isSelf
            });
        });

        socket.on('connect_error', () => {
            updateRecoveryStatus();
        });

        socket.on('chat:error', ({ message }) => {
            showError(message || 'El missatge no és vàlid.');
        });

        updateConnectionState();
    </script>
</body>

</html>
