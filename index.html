<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xat Socket.IO</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <main class="app">
        <section id="loginFormSection" class="login-card">
            <h1>Entrada al xat</h1>
            <div class="login-field">
                <label for="username">Nom</label>
                <input id="username" type="text" maxlength="20" placeholder="Escriu el teu nom" />
            </div>
            <button id="joinBtn" type="button" class="login-btn">Entrar</button>
            <div id="errorMessage" class="error" aria-live="polite"></div>
        </section>

        <section id="chatSection" class="chat-card hidden">
            <div class="chat-window">
                <header class="chat-header">
                    <div class="chat-title">Xat</div>
                    <div class="chat-user">Usuari: <strong id="currentUser"></strong></div>
                    <div id="connectionStatus" class="connection-status"><span id="connectionDot" class="dot"></span> En línia</div>
                </header>

                <div id="messages" class="messages" aria-live="polite">
                    <div class="message">
                        <div class="message-header">
                            <span class="message-author">Sistema</span>
                            <span class="message-time">12:00</span>
                        </div>
                        <p class="message-text">Aquí apareixeran els missatges del xat.</p>
                    </div>
                </div>

                <form class="composer" id="messageForm">
                    <input id="messageInput" type="text" placeholder="Escriu un missatge..." autocomplete="off" disabled />
                    <div class="composer-actions">
                        <button id="disconnectBtn" type="button" class="secondary-btn">Desconnectar</button>
                        <button id="sendBtn" type="submit" disabled>Enviar</button>
                    </div>
                </form>
                <div id="recoveryStatus" class="recovery-status" aria-live="polite">Estat de recuperació: pendent</div>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({
            reconnectionDelay: 1000,
            reconnectionDelayMax: 2000,
            randomizationFactor: 0
        });

        const usernameInput = document.getElementById('username');
        const joinBtn = document.getElementById('joinBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loginFormSection = document.getElementById('loginFormSection');
        const chatSection = document.getElementById('chatSection');
        const currentUser = document.getElementById('currentUser');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const messagesContainer = document.getElementById('messages');
        const sendBtn = document.getElementById('sendBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const connectionStatus = document.getElementById('connectionStatus');
        const recoveryStatus = document.getElementById('recoveryStatus');

        let lastMessageId = 0;

        function addMessage({ author, text, time, isSelf }) {
            const message = document.createElement('div');
            message.className = `message ${isSelf ? 'self' : ''}`;

            const header = document.createElement('div');
            header.className = 'message-header';

            const authorEl = document.createElement('span');
            authorEl.className = 'message-author';
            authorEl.textContent = author;

            const timeEl = document.createElement('span');
            timeEl.className = 'message-time';
            timeEl.textContent = time;

            const textEl = document.createElement('p');
            textEl.className = 'message-text';
            textEl.textContent = text;

            header.appendChild(authorEl);
            header.appendChild(timeEl);
            message.appendChild(header);
            message.appendChild(textEl);
            messagesContainer.appendChild(message);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateConnectionState() {
            const connected = socket.connected;
            const hasUser = currentUser.textContent.trim().length > 0;

            connectionStatus.classList.toggle('offline', !connected);
            connectionStatus.innerHTML = `<span class="dot ${connected ? '' : 'offline'}"></span> ${connected ? 'En línia' : 'Desconnectat'}`;
            messageInput.disabled = !connected || !hasUser;
            sendBtn.disabled = !connected || !hasUser;
            disconnectBtn.disabled = !hasUser;
            disconnectBtn.textContent = connected ? 'Desconnectar' : 'Connectar';
        }

        function updateRecoveryStatus(message) {
            recoveryStatus.textContent = message;
            recoveryStatus.classList.toggle('success', message.includes('correcta'));
            recoveryStatus.classList.toggle('warning', !message.includes('correcta'));
        }

        joinBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();

            if (!name || name.length > 20) {
                errorMessage.textContent = 'El nom no pot estar buit ni tenir més de 20 caràcters.';
                return;
            }

            errorMessage.textContent = '';
            socket.emit('join-chat', { name });
        });

        messageForm.addEventListener('submit', (event) => {
            event.preventDefault();

            if (!socket.connected) {
                return;
            }

            const text = messageInput.value.trim();
            if (!text) {
                return;
            }

            socket.emit('chat:send', {
                username: currentUser.textContent.trim(),
                text
            });

            messageInput.value = '';
        });

        disconnectBtn.addEventListener('click', () => {
            if (!currentUser.textContent.trim()) {
                return;
            }

            if (socket.connected) {
                socket.disconnect();
            } else {
                socket.connect();
            }
        });

        socket.on('connect', () => {
            const params = new URLSearchParams({ lastMessageId: String(lastMessageId) });
            socket.io.opts.query = params.toString();
            updateConnectionState();
            updateRecoveryStatus('Recuperació: pendent');
        });

        socket.on('reconnect', () => {
            updateConnectionState();
            updateRecoveryStatus('Recuperació: correcta');
        });

        socket.on('disconnect', () => {
            updateConnectionState();
            updateRecoveryStatus('Desconnectat. Recuperació pendent');
        });

        socket.on('join-success', ({ username }) => {
            currentUser.textContent = username;
            loginFormSection.classList.add('hidden');
            chatSection.classList.remove('hidden');
            updateConnectionState();
        });

        socket.on('join-error', ({ message }) => {
            errorMessage.textContent = message || 'El nom no és vàlid.';
        });

        socket.on('chat:message', (message) => {
            if (message.id > lastMessageId) {
                lastMessageId = message.id;
            }

            const isSelf = message.username === currentUser.textContent.trim();
            addMessage({
                author: message.username,
                text: message.text,
                time: message.time,
                isSelf
            });
        });

        socket.on('chat:missed', (messages) => {
            messages.forEach((message) => {
                if (message.id > lastMessageId) {
                    lastMessageId = message.id;
                }

                addMessage({
                    author: message.username,
                    text: message.text,
                    time: message.time,
                    isSelf: message.username === currentUser.textContent.trim()
                });
            });
        });

        socket.on('chat:error', ({ message }) => {
            errorMessage.textContent = message || 'El missatge no és vàlid.';
        });

        updateConnectionState();
    </script>
</body>

</html>
