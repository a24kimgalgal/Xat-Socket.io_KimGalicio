<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xat Socket.IO - Escalat horitzontal</title>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body>
    <main class="app">
        <section id="loginFormSection" class="login-card">
            <h1>Entrada al xat</h1>
            <p class="subtitle">Connectat a http://localhost:<strong id="loginPort"></strong></p>
            <form id="loginForm" autocomplete="off">
                <div class="login-field">
                    <label for="username">Nom</label>
                    <input id="username" type="text" maxlength="20" placeholder="Escriu el teu nom" required autofocus />
                </div>
                <button id="joinBtn" type="submit" class="login-btn">Entrar</button>
            </form>
            <div id="loginError" class="error" aria-live="polite"></div>
        </section>

        <section id="chatSection" class="chat-card hidden">
            <div class="chat-window">
                <header class="chat-header">
                    <div class="chat-title">Xat (Port <span id="headerPort"></span>)</div>
                    <div class="chat-user">Usuari: <strong id="currentUser"></strong></div>
                    <div id="connectionStatus" class="connection-status">
                        <span id="connectionDot" class="dot"></span>
                        <span id="connectionText">Connectat</span>
                    </div>
                </header>

                <div id="messages" class="messages" aria-live="polite"></div>

                <div id="chatErrorMessage" class="error chat-error" aria-live="polite"></div>

                <form class="composer" id="messageForm" autocomplete="off">
                    <input id="messageInput" type="text" maxlength="500" placeholder="Escriu un missatge..." autocomplete="off" disabled />
                    <button id="sendBtn" type="submit" disabled>Enviar</button>
                </form>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const currentPort = window.location.port || '3000';
        document.getElementById('loginPort').textContent = currentPort;
        document.getElementById('headerPort').textContent = currentPort;

        const loginFormSection = document.getElementById('loginFormSection');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const loginError = document.getElementById('loginError');

        const chatSection = document.getElementById('chatSection');
        const currentUser = document.getElementById('currentUser');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionDot = document.getElementById('connectionDot');
        const connectionText = document.getElementById('connectionText');

        const messagesContainer = document.getElementById('messages');
        const chatErrorMessage = document.getElementById('chatErrorMessage');
        const messageForm = document.getElementById('messageForm');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage({ author, text, time, isSelf }) {
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isSelf ? 'self' : ''}`;

            const headerEl = document.createElement('div');
            headerEl.className = 'message-header';

            const authorEl = document.createElement('span');
            authorEl.className = 'message-author';
            authorEl.textContent = author;

            const timeEl = document.createElement('span');
            timeEl.className = 'message-time';
            timeEl.textContent = time;

            headerEl.appendChild(authorEl);
            headerEl.appendChild(timeEl);

            const textEl = document.createElement('p');
            textEl.className = 'message-text';
            textEl.textContent = text;

            messageEl.appendChild(headerEl);
            messageEl.appendChild(textEl);

            messagesContainer.appendChild(messageEl);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateConnectionState() {
            const connected = socket.connected;
            const hasUser = currentUser.textContent.trim().length > 0;

            connectionStatus.classList.toggle('offline', !connected);
            connectionDot.classList.toggle('offline', !connected);
            connectionText.textContent = connected ? 'En línia' : 'Desconnectat';

            messageInput.disabled = !connected || !hasUser;
            sendBtn.disabled = !connected || !hasUser;
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();

            if (!name || name.length > 20) {
                loginError.textContent = 'El nom no és vàlid.';
                return;
            }

            loginError.textContent = '';
            socket.emit('join-chat', { name });
        });

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!socket.connected) return;

            const text = messageInput.value.trim();
            if (!text) return;

            chatErrorMessage.textContent = '';
            socket.emit('chat:send', { text });

            messageInput.value = '';
            messageInput.focus();
        });

        socket.on('connect', () => {
            updateConnectionState();
        });

        socket.on('disconnect', () => {
            updateConnectionState();
        });

        socket.on('join-success', ({ username }) => {
            currentUser.textContent = username;
            loginFormSection.classList.add('hidden');
            chatSection.classList.remove('hidden');
            updateConnectionState();
            messageInput.focus();
        });

        socket.on('join-error', ({ message }) => {
            loginError.textContent = message || 'Nom invàlid.';
        });

        socket.on('chat:message', (message) => {
            chatErrorMessage.textContent = '';
            const isSelf = message.username === currentUser.textContent.trim();
            addMessage({
                author: message.username,
                text: message.text,
                time: message.time,
                isSelf
            });
        });

        socket.on('chat:error', ({ message }) => {
            chatErrorMessage.textContent = message || 'Error en enviar el missatge.';
        });

        updateConnectionState();
    </script>
</body>

</html>
